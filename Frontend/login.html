<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AFM Music Analytics</title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">
    <script src="config.js"></script>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back 👋</h1>
            <h2>Login to AFM Music Analytics</h2>
            <p>Sign in to continue listening and explore your music analytics.</p>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="input-box">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="extra-links">
                <a href="#">Forgot Password?</a>

                <p>
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>
            </div>

            <hr>

            <h3>OR</h3>

            <!-- Google Sign In -->

            <div id="g_id_onload"
                data-client_id="859750304042-dmq7cu320av682qgev0hnqkiv7err110.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                data-type="standard"
                data-shape="pill"
                data-theme="outline"
                data-size="large"
                data-text="signin_with"
                data-logo_alignment="left">
            </div>

        </div>

    </div>

    <script>
        // ==============================
        // Email & Password Login
        // ==============================

        document.getElementById("loginForm").addEventListener("submit", async function (e) {

            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch(`${API_URL}/api/auth/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                });

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));

                    alert("Login Successful!");

                    window.location.href = "index.html";

                } else {

                    alert(data.message || "Invalid Email or Password");

                }

            } catch (error) {

                console.error(error);

                alert("Unable to connect to the server.");

            }

        });

        // ==============================
        // Google Login
        // ==============================

        async function handleCredentialResponse(response) {

            const idToken = response.credential;

            try {

                const res = await fetch(`${API_URL}/api/auth/google`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: idToken
                    })

                });

                const data = await res.json();

                if (data.success) {

                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));

                    alert("Google Login Successful!");

                    window.location.href = "index.html";

                } else {

                    alert("Google Login Failed!");

                }

            } catch (error) {

                console.error(error);

                alert("Server Error");

            }

        }

    </script>

</body>

</html>
